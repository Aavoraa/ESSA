# nginx in front of ESSA AI (essa-ai.aavoraa.com).
#
# Fixes the findings of the Oct 2026 security review that live at the proxy:
#   * server_tokens off           — no more "Server: nginx/1.30.4"
#   * HSTS, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy, CSP
#
# The app sets the same headers itself (backend/app/security_headers.py), with
# a CSP that differs by path. The proxy_hide_header lines drop the app's copies
# so each header goes out exactly once; the CSP is left to the app because only
# it knows which front-end a path belongs to.
#
# Install:  copy to /etc/nginx/conf.d/essa.conf (or merge into the existing
# server blocks), adjust ssl_certificate paths and the upstream port, then
#   sudo nginx -t && sudo systemctl reload nginx

# Hide the version on every response, error pages included.
server_tokens off;

upstream essa_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name essa-ai.aavoraa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name essa-ai.aavoraa.com;

    ssl_certificate     /etc/letsencrypt/live/essa-ai.aavoraa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/essa-ai.aavoraa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    # `always` so 4xx/5xx answers carry them too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;

    # Built desktop app, if nginx serves it directly (otherwise drop this and
    # let the backend serve frontend/dist — see app/main.py).
    root /var/www/essa/frontend/dist;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        # The desktop SPA: a Vite bundle with no inline script.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # API, phone app and shop: proxied; the app supplies the per-path CSP.
    location ~ ^/(api|m|pos|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://essa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }
}
