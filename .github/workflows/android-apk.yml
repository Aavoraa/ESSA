name: Build warehouse APK

# Builds the phone app and attaches the APK to the run, so a phone can install it
# without anyone having Android Studio. Run it from the Actions tab (Run workflow)
# or just push a change under android/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cheap and first: the injected scanner shim leans on the mobile page's
      # internals, and a rename there breaks the phone's scan button without
      # breaking the build. Better to fail here than to ship a working-looking APK.
      - name: Check the scanner shim still matches the page
        run: node android/tools/shim_test.mjs

      # The setup screen decides http-and-:8000 or https-and-:443 from the shape
      # of what is typed, and the two want opposite answers. Getting it backwards
      # reports a working server as unreachable, which reads as a server fault —
      # so it is checked here rather than discovered on a phone.
      - name: Check the server-address parsing
        run: node android/tools/normalise_test.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already carries the Android SDK at $ANDROID_HOME, so all
      # that is needed is to accept its licences and make sure the two packages
      # this build compiles against are there. Done in the shell rather than with
      # android-actions/setup-android, which stopped working once GitHub began
      # forcing Node 20 actions onto Node 24.
      - name: Set up Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # No Gradle wrapper is committed — a wrapper is a binary jar, and pinning the
      # version here does the same job without one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # Named for the app, not for the build. This is the file that lands in
      # someone's downloads and then on a phone, beside an icon that already says
      # ESSA AI — a filename carrying a run number and a commit hash makes the
      # two look like different things. Which build it is stays answerable: the
      # run itself records its commit, and the summary below repeats it.
      - name: Name the APK
        id: name
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT="ESSA-AI.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"
          {
            echo "### ESSA-AI.apk"
            echo ""
            echo "- build \`#${GITHUB_RUN_NUMBER}\` from commit \`${GITHUB_SHA::7}\`"
            echo "- download it under **Artifacts** below, then open it on the phone"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ESSA-AI
          path: ${{ steps.name.outputs.path }}
          if-no-files-found: error
