# The Xcode project, described rather than committed. A .xcodeproj is a file
# nobody can review or merge, and it is generated from this in one command:
#
#     brew install xcodegen      (once)
#     cd ios && xcodegen generate
#
# which writes Warexx.xcodeproj next to this file. CI does the same — see
# .github/workflows/ios-app.yml.
name: Warexx
options:
  bundleIdPrefix: com.essa
  deploymentTarget:
    iOS: "15.0"                # iPhone 6s / SE (1st gen) and newer, every iPad since 2015
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Warexx:
    type: application
    platform: iOS
    sources:
      - path: Warexx
    settings:
      base:
        # The same identifier as the Android app. Change it here if the Apple
        # account registers a different one.
        PRODUCT_BUNDLE_IDENTIFIER: com.essa.warehouse
        PRODUCT_NAME: Warexx
        INFOPLIST_FILE: Warexx/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Your Apple Developer Team ID (Xcode › Settings › Accounts). Left blank
        # so the project opens anywhere; Xcode asks for it on the first run.
        DEVELOPMENT_TEAM: ""
  WarexxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WarexxTests
    dependencies:
      - target: Warexx
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.essa.warehouse.tests
schemes:
  Warexx:
    build:
      targets:
        Warexx: all
        WarexxTests: [test]
    test:
      targets:
        - WarexxTests
